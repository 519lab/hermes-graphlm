name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv .venv --python 3.12
          # Same graphlm constraint as pyproject.toml [project].dependencies — keep them in step.
          uv pip install --python .venv/bin/python \
            "graphlm[all]>=0.7,<0.8" \
            "pytest>=8,<10" "pytest-cov>=5,<8" "pyyaml>=6,<7" "fastapi>=0.110,<1" "httpx>=0.27,<1"
      - name: Tests
        run: .venv/bin/python -m pytest tests --cov=. --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop half — syntax and catalog surface rules
        run: |
          node --check desktop/plugin.js
          if grep -nE 'new Function|eval\(|<script|import\(' desktop/plugin.js; then
            echo "desktop/plugin.js uses a pattern the catalog validator refuses"; exit 1
          fi

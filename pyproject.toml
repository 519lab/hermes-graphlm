[project]
name = "hermes-graphlm"
version = "0.1.0"
description = "Hermes Agent plugin: live codebase map powered by graphlm"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "graphlm[all]>=0.7,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "bench/*"]

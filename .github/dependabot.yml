# Dependabot configuration — onboarding.
# hermes-graphlm has a supported manifest (pyproject.toml) but no
# dependency-management config. Conservative defaults; no auto-merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      # The shared ggrace519/.github workflows are our own releases: take them
      # as soon as they are out instead of after the default 3-day cooldown.
      exclude:
        - ggrace519/.github/.github/workflows/promote.yml
        - ggrace519/.github/.github/workflows/release.yml
        - ggrace519/.github/.github/workflows/version.yml
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

# Dependabot configuration — onboarding.
# hermes-graphlm has a supported manifest (pyproject.toml) but no
# dependency-management config. Conservative defaults; no auto-merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
